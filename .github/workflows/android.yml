name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          # The runner's preinstalled cmdline-tools (16.0) cannot see SDK minor
          # versions such as android-37.2; upgrade it first.
          old=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$old" --install "cmdline-tools;latest" > /dev/null || true
          # The new tools may land in cmdline-tools/latest-<n>; pick the newest.
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --list | grep -E "android-37|build-tools;37" | head -n 20 || true
          yes | "$SM" "platforms;android-37.2" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: coldcat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
